steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--revision-suffix'
      - '${_REVISION_SUFFIX}'
      - '--update-labels'
      - 'git-sha=${_GIT_SHA},cloud-build-id=$BUILD_ID'
      # Existing production bindings verified on 2026-07-30 are retained by this incremental deploy.
      # env-parity-preserved: NODE_ENV,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,WORKFLOWS_DB,GOOGLE_CLOUD_PROJECT_ID,GOOGLE_CLOUD_REGION,STORAGE_BUCKET_NAME,STORY_GENERATION_WORKFLOW_API_KEY,ANALYTICS_SCHEDULER_SERVICE_ACCOUNT
      - '--update-env-vars'
      - 'DEPLOY_GIT_SHA=${_GIT_SHA},DEPLOY_BUILD_ID=$BUILD_ID,TEXT_PROVIDER=google-genai,IMAGE_PROVIDER=google-genai,IMAGE_ANALYZER_PROVIDER=google-genai,GOOGLE_GENAI_MODEL=gemini-3.6-flash,GOOGLE_GENAI_IMAGE_MODEL=gemini-3.1-flash-image'
      - '--quiet'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'

substitutions:
  _SERVICE_NAME: 'story-generation-workflow'
  _REGION: 'europe-west9'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '100'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: '1200s'
