steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NODE_VERSION=${_NODE_VERSION}'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '$PROJECT_ID'
      - '--revision-suffix'
      - '${_REVISION_SUFFIX}'
      - '--update-labels'
      - 'git-sha=${_GIT_SHA},cloud-build-id=$BUILD_ID'
      - '--update-env-vars'
      - 'DEPLOY_GIT_SHA=${_GIT_SHA},DEPLOY_BUILD_ID=$BUILD_ID${_STORY_TEXT_MODE_UPDATE}'
      - '--quiet'
      # Existing Cloud Run environment variables.
      # env-parity-preserved: NODE_ENV,DB_PORT,DB_NAME,WORKFLOWS_DB,GOOGLE_CLOUD_PROJECT_ID,GOOGLE_CLOUD_REGION
      # env-parity-preserved: STORAGE_BUCKET_NAME,TEXT_PROVIDER,IMAGE_PROVIDER,GOOGLE_GENAI_MODEL,GOOGLE_GENAI_IMAGE_MODEL
      # env-parity-preserved: OPENAI_BASE_MODEL,OPENAI_IMAGE_TOOL_MODEL,OPENAI_IMAGE_QUALITY,OPENAI_TEXT_MODEL,TTS_PROVIDER
      # env-parity-preserved: TTS_MODEL,TTS_VOICE,TTS_SPEED,TTS_LANGUAGE,BACKGROUND_MUSIC_VOLUME,NARRATOR_VOLUME
      # env-parity-preserved: BACKGROUND_MUSIC_FADE_IN,BACKGROUND_MUSIC_FADE_OUT,DEBUG_AI_FULL_PROMPTS,DEBUG_AI_FULL_RESPONSES
      # env-parity-preserved: DEBUG_PERSIST_PROMPTS,LOG_LEVEL,NOTIFICATION_ENGINE_URL,WEBAPP_WEBHOOK_URL,STORY_CONTEXT_MAX_CHARS
      # env-parity-preserved: ANALYTICS_SCHEDULER_SERVICE_ACCOUNT,IMAGE_ANALYZER_PROVIDER,TTS_EXPRESSIVE_DIRECTION_ENABLED
      # env-parity-preserved: TTS_DIRECTION_MODEL,GOOGLE_GENAI_API_VERSION,STORY_TEXT_GENERATION_MODE,STORY_SEQUENTIAL_AUDIENCES
      # env-parity-preserved: STORY_SEQUENTIAL_MIN_CHAPTERS,STORY_WHOLE_MAX_OUTPUT_TOKENS,STORY_CHAPTER_MAX_OUTPUT_TOKENS
      # Provision the dedicated private bucket before enabling paid order proofs.
      # env-parity-preserved: PRINT_PROOF_BUCKET,APP_BASE_URL
      # env-parity-preserved: PREMIUM_BOOK_BUCKET,PREMIUM_IMAGE_PROVIDER,PREMIUM_IMAGE_MODEL,PREMIUM_IMAGE_QUALITY,PREMIUM_IMAGE_SPREAD_SIZE,PREMIUM_IMAGE_SQUARE_SIZE
      # Existing Secret Manager bindings.
      # env-parity-preserved: DB_HOST,DB_USER,DB_PASSWORD,OPENAI_API_KEY,GOOGLE_GENAI_API_KEY,STORY_GENERATION_WORKFLOW_API_KEY
      # env-parity-preserved: NOTIFICATION_ENGINE_API_KEY,WEBAPP_WEBHOOK_SECRET

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:${_GIT_SHA}'

substitutions:
  _SERVICE_NAME: 'story-generation-workflow'
  _REGION: 'europe-west9'
  _GIT_SHA: 'unknown'
  _REVISION_SUFFIX: 'git-unknown'
  _NODE_VERSION: '24.18.1'
  _STORY_TEXT_MODE_UPDATE: ''

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '100'
  logging: 'CLOUD_LOGGING_ONLY'

timeout: '1200s'
