# Mythoria – Audiobook Generation Workflow
# Trigger: Pub/Sub topic mythoria-audiobook-requests
#
# Pub/Sub message (base-64 JSON):
#   { "storyId": "<uuid>", "runId": "<uuid>", "voice": "<voice>", "includeBackgroundMusic": true, "timestamp": "<iso-string>" }
#   voice is optional: empty or "auto" lets SGW pick the recommended voice for the story audience.
#   premiumRevision is optional: it pins a published premium edition for page narration.
#
# Cloud Run base URL (internal API + AI-Gateway):
#   https://story-generation-workflow-803421888801.europe-west9.run.app
#

main:
  params: [event]

  steps:
    # ───────────────────────────────────────────────
    # 0. Parse event & constants
    # ───────────────────────────────────────────────
    - init:
        assign:
          - payload: ${json.decode(base64.decode(event.data.message.data))}
          - storyId: ${payload.storyId}
          - runId: ${payload.runId}
          - voice: ${default(map.get(payload, "voice"), "")}
          - includeBackgroundMusic: ${default(map.get(payload, "includeBackgroundMusic"), true)}
          - premiumRevision: ${map.get(payload, "premiumRevision")}
          - baseUrl: 'https://story-generation-workflow-803421888801.europe-west9.run.app'
          - chapterGenerationConcurrency: 4
          - chapterAudioMaxAttempts: 2
          - chapterAudioRetryDelaySeconds: 10
          - now: ${time.format(sys.now())}

    - selectAudiobookSource:
        switch:
          - condition: ${premiumRevision != null}
            steps:
              - narratePremiumEdition:
                  call: premiumAudiobook
                  args:
                    baseUrl: ${baseUrl}
                    storyId: ${storyId}
                    runId: ${runId}
                    revision: ${premiumRevision}
                    voice: ${voice}
                    includeBackgroundMusic: ${includeBackgroundMusic}
                  result: premiumResult
              - returnPremiumResult:
                  return: ${premiumResult}

    # ───────────────────────────────────────────────
    # 1. Pipeline wrapped in one try/except for error handling
    # ───────────────────────────────────────────────
    - runAudiobookPipeline:
        try:
          steps:
            # 0. Atomically claim this run so Pub/Sub redelivery cannot duplicate work.
            - claimRun:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/runs/" + runId + "/claim"}
                  method: POST
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                result: claimResp

            - stopDuplicateRun:
                switch:
                  - condition: ${not(claimResp.body.claimed)}
                    return: ${claimResp.body}

            # 1. Mark audiobook generation as started
            - markAudiobookStarted:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/stories/" + storyId + "/audiobook-status"}
                  method: PATCH
                  auth: { type: OIDC }
                  body:
                    status: 'generating'
                    runId: ${runId}
                    startedAt: ${time.format(sys.now())}

            # 2. Validate story exists and get story HTML
            - validateStory:
                steps:
                  # Get story details to validate it exists
                  - getStory:
                      call: http.request
                      args:
                        url: ${baseUrl + "/internal/stories/" + storyId}
                        method: GET
                        auth: { type: OIDC }
                      result: storyResp

                  # Download and parse story HTML from storage
                  - getStoryHtml:
                      call: http.request
                      args:
                        url: ${baseUrl + "/internal/stories/" + storyId + "/html"}
                        method: GET
                        auth: { type: OIDC }
                      result: htmlResp

                  - extractStoryContent:
                      assign:
                        - storyTitle: ${storyResp.body.title}
                        - storyAuthor: ${default(htmlResp.body.author, "")}
                        - dedicatoryMessage: ${default(htmlResp.body.dedicationMessage, "")}
                        - storyLanguage: ${default(storyResp.body.storyLanguage, "en-US")}
                        - chapters: ${htmlResp.body.chapters} # Chapters from database

            # 3. Generate audio for each chapter in parallel
            - generateChapterAudios:
                parallel:
                  concurrency_limit: ${chapterGenerationConcurrency}
                  for:
                    range: ${[1, len(chapters)]}
                    value: chapterNum
                    steps:
                      - initChapterAudioRetry:
                          assign:
                            - chapterAudioSuccess: false
                            - chapterAudioLastError: null

                      - chapterAudioRetryLoop:
                          for:
                            value: attempt
                            range: ${[1, chapterAudioMaxAttempts]}
                            steps:
                              - checkChapterAudioAlreadySuccessful:
                                  switch:
                                    - condition: ${chapterAudioSuccess}
                                      next: continue

                              - tryChapterAudioGeneration:
                                  try:
                                    steps:
                                      - generateChapterAudio:
                                          call: http.request
                                          args:
                                            url: ${baseUrl + "/internal/audiobook/chapter"}
                                            method: POST
                                            timeout: 1800
                                            auth: { type: OIDC }
                                            body:
                                              storyId: ${storyId}
                                              chapterNumber: ${chapterNum}
                                              chapterTitle: ${chapters[chapterNum - 1].title}
                                              chapterContent: ${chapters[chapterNum - 1].content}
                                              storyTitle: ${storyTitle}
                                              storyAuthor: ${storyAuthor}
                                              dedicatoryMessage: ${dedicatoryMessage}
                                              voice: ${voice}
                                              storyLanguage: ${storyLanguage}
                                              isFirstChapter: ${chapterNum == 1}
                                              includeBackgroundMusic: ${includeBackgroundMusic}
                                      - markChapterAudioAttemptSuccess:
                                          assign:
                                            - chapterAudioSuccess: true
                                  except:
                                    as: chapterAudioAttemptError
                                    steps:
                                      - saveChapterAudioError:
                                          assign:
                                            - chapterAudioLastError: ${chapterAudioAttemptError}
                                      - extractChapterAudioErrorCode:
                                          assign:
                                            - chapterAudioErrorCode: ${default(map.get(chapterAudioAttemptError, "code"), 0)}
                                      - classifyChapterAudioRetryability:
                                          assign:
                                            - chapterAudioIsRetryable: ${chapterAudioErrorCode == 0 or chapterAudioErrorCode == 408 or chapterAudioErrorCode == 429 or chapterAudioErrorCode >= 500}
                                      - stopNonRetryableChapterAudio:
                                          switch:
                                            - condition: ${not(chapterAudioIsRetryable)}
                                              steps:
                                                - logChapterAudioNonRetryable:
                                                    call: sys.log
                                                    args:
                                                      severity: ERROR
                                                      text: '${"Chapter " + string(chapterNum) + " audio failed with non-retryable HTTP code " + string(chapterAudioErrorCode) + ": " + chapterAudioAttemptError.message}'
                                                - raiseChapterAudioNonRetryable:
                                                    raise: ${chapterAudioAttemptError}
                                      - logChapterAudioRetry:
                                          call: sys.log
                                          args:
                                            severity: WARNING
                                            text: '${"Chapter " + string(chapterNum) + " audio attempt " + string(attempt) + " failed, retrying after " + string(chapterAudioRetryDelaySeconds) + "s: " + chapterAudioAttemptError.message}'
                                      - maybeDelayChapterAudioRetry:
                                          switch:
                                            - condition: ${attempt < chapterAudioMaxAttempts}
                                              steps:
                                                - delayChapterAudioRetry:
                                                    call: sys.sleep
                                                    args:
                                                      seconds: ${chapterAudioRetryDelaySeconds}

                      - handleChapterAudioOutcome:
                          switch:
                            - condition: ${not(chapterAudioSuccess)}
                              steps:
                                - logChapterAudioFailure:
                                    call: sys.log
                                    args:
                                      severity: ERROR
                                      text: '${"Chapter audio failed after retries for chapter " + string(chapterNum) + "; last error: " + chapterAudioLastError.message}'
                                - raiseChapterAudioFailure:
                                    raise: ${chapterAudioLastError}

            # 4. Finalize audiobook and mark as completed
            - finalizeAudiobook:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/audiobook/finalize"}
                  method: POST
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                    runId: ${runId}
                result: finalizeResp

            - validateAudiobookCompleteness:
                switch:
                  - condition: ${finalizeResp.body.chaptersProcessed == len(chapters)}
                    next: markAudiobookCompleted
                  - condition: ${finalizeResp.body.chaptersProcessed != len(chapters)}
                    steps:
                      - raiseIncompleteAudiobook:
                          raise: '${"Audiobook incomplete after finalize. Expected chapters: " + string(len(chapters)) + ", generated chapters: " + string(finalizeResp.body.chaptersProcessed)}'

            # 5. Mark audiobook as completed
            - markAudiobookCompleted:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/stories/" + storyId + "/audiobook-status"}
                  method: PATCH
                  auth: { type: OIDC }
                  body:
                    status: 'completed'
                    runId: ${runId}
                    completedAt: ${time.format(sys.now())}
                    audioUrls: ${finalizeResp.body.audioUrls}
                    chapters: ${finalizeResp.body.audiobookChapters}
                    totalDuration: ${finalizeResp.body.totalDuration}
                    expectedChapters: ${len(chapters)}
                    generatedChapters: ${finalizeResp.body.chaptersProcessed}

            - returnSuccess:
                return:
                  success: true
                  storyId: ${storyId}
                  runId: ${runId}
                  audioUrls: ${finalizeResp.body.audioUrls}
                  totalDuration: ${finalizeResp.body.totalDuration}
                  chaptersProcessed: ${finalizeResp.body.chaptersProcessed}
                  generatedAt: ${now}

        except:
          as: audioError
          steps:
            # Mark audiobook generation as failed
            - markAudiobookFailed:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/stories/" + storyId + "/audiobook-status"}
                  method: PATCH
                  auth: { type: OIDC }
                  body:
                    status: 'failed'
                    runId: ${runId}
                    failedAt: ${time.format(sys.now())}
                    failureStage: 'audiobook_generation'
                    error: ${string(audioError)}

            - rethrowAudioError:
                raise: ${audioError}

premiumAudiobook:
  params: [baseUrl, storyId, runId, revision, voice, includeBackgroundMusic]
  steps:
    - fetchApiKey:
        call: googleapis.secretmanager.v1.projects.secrets.versions.access
        args:
          name: projects/803421888801/secrets/STORY_GENERATION_WORKFLOW_API_KEY/versions/latest
        result: apiKeySecret
    - initializePremiumRequest:
        assign:
          - apiKey: ${text.decode(base64.decode(apiKeySecret.payload.data))}
          - endpoint: ${baseUrl + "/internal/audiobook/premium/"}
          - identity:
              storyId: ${storyId}
              runId: ${runId}
              revision: ${revision}
              executionId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - runPremiumAudiobook:
        try:
          steps:
            - planPremiumPages:
                try:
                  call: http.post
                  args:
                    url: ${endpoint + "plan"}
                    auth: { type: OIDC }
                    headers:
                      x-api-key: ${apiKey}
                    body: ${identity}
                  result: planResponse
                retry: ${http.default_retry}
            - skipDuplicatePremiumAudiobook:
                switch:
                  - condition: ${not(planResponse.body.claimed)}
                    return: ${planResponse.body}
            - generatePremiumPages:
                parallel:
                  concurrency_limit: 4
                  for:
                    value: pageNumber
                    in: ${planResponse.body.pageNumbers}
                    steps:
                      - narratePremiumPage:
                          try:
                            call: http.post
                            args:
                              url: ${endpoint + "page"}
                              timeout: 1800
                              auth: { type: OIDC }
                              headers:
                                x-api-key: ${apiKey}
                              body:
                                storyId: ${storyId}
                                runId: ${runId}
                                revision: ${revision}
                                executionId: ${identity.executionId}
                                pageNumber: ${pageNumber}
                                voice: ${voice}
                                includeBackgroundMusic: ${includeBackgroundMusic}
                          retry:
                            predicate: ${retryPremiumNarration}
                            max_retries: 1
                            backoff:
                              initial_delay: 10
                              max_delay: 10
                              multiplier: 1
            - completePremiumAudiobook:
                try:
                  call: http.post
                  args:
                    url: ${endpoint + "complete"}
                    auth: { type: OIDC }
                    headers:
                      x-api-key: ${apiKey}
                    body: ${identity}
                  result: completed
                retry: ${http.default_retry}
            - returnCompletedPremiumAudiobook:
                return: ${completed.body}
        except:
          as: premiumError
          steps:
            - failPremiumAudiobook:
                try:
                  call: http.post
                  args:
                    url: ${endpoint + "failed"}
                    auth: { type: OIDC }
                    headers:
                      x-api-key: ${apiKey}
                    body: ${identity}
                retry: ${http.default_retry}
            - rethrowPremiumAudiobookError:
                raise: ${premiumError}

retryPremiumNarration:
  params: [error]
  steps:
    - readStatus:
        assign:
          - code: ${default(map.get(error, "code"), 0)}
    - canRetry:
        return: ${code == 0 or code == 408 or code == 429 or code >= 500}
