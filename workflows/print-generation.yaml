# Mythoria – Print Generation Workflow
# Trigger: Pub/Sub topic mythoria-print-requests
#
# Pub/Sub message (base-64 JSON):
#   For self-print (PDF download): { "storyId": "<uuid>", "runId": "<uuid>", "initiatedBy": "selfService", "delivery": {...} }
#   For print order (physical book): { "storyId": "<uuid>", "runId": "<uuid>" }
#
# Cloud Run base URL (internal API):
#   https://story-generation-workflow-803421888801.europe-west9.run.app
#
main:
  params: [event]

  steps:
    # ───────────────────────────────────────────────
    # 0. Parse event & constants
    # ───────────────────────────────────────────────
    - init:
        assign:
          - payload: ${json.decode(base64.decode(event.data.message.data))}
          - storyId: ${payload.storyId}
          - runId: ${payload.runId}
          - baseUrl: 'https://story-generation-workflow-803421888801.europe-west9.run.app'
          - now: ${time.format(sys.now())}
          - initiatedBy: ${default(map.get(payload, "initiatedBy"), "printOrder")}
          - delivery: ${default(map.get(payload, "delivery"), null)}
          - qaAlertSent: false
          - qaAlertFailureReason: null
          - qaCriticalErrors: []
          - originGuess: 'admin'
          - printDeliveryStatus: 'not_requested'
          - qaSkip: ${default(map.get(payload, "skipQA"), false)}
          - activePrintResult: null
          - qaStatus: 'skipped'
          - qaReportUrl: null
          - qaCriticalCount: 0
          - qaWarningCount: 0
          - qaFixesApplied: []
          - currentStage: 'authorization'

    # Resolve origin in a separate step to avoid YAML/ternary parsing issues
    - setOriginFromInitiatedBy:
        switch:
          - condition: ${initiatedBy == "selfService"}
            next: setOriginSelfService
          - condition: ${initiatedBy == "adminPortal"}
            next: setOriginAdmin
        next: setOriginDefault

    - setOriginSelfService:
        assign:
          - originGuess: 'self-service'
        next: setOriginDefault

    - setOriginAdmin:
        assign:
          - originGuess: 'admin'
        next: setOriginDefault

    - setOriginDefault:
        assign:
          - originGuess: ${default(originGuess, "admin")}
          - origin: ${default(map.get(payload, "origin"), originGuess)}

    # ───────────────────────────────────────────────
    # 1-N. Print pipeline wrapped in one try/except
    # ───────────────────────────────────────────────
    - runPrintPipeline:
        try:
          steps:
            - claimRun:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/runs/" + runId + "/claim"}
                  method: POST
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                result: claimResp

            - stopDuplicateRun:
                switch:
                  - condition: ${not(claimResp.body.claimed)}
                    return: ${claimResp.body}

            # 1. Mark run → running / generate_print_pdfs
            - markRunStarted:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/runs/" + runId}
                  method: PATCH
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                    status: 'running'
                    currentStep: 'generate_print_pdfs'
                    startedAt: ${time.format(sys.now())}

            # 2. Generate print PDFs
            - setPdfGenerationStage:
                assign:
                  - currentStage: 'pdf_generation'

            - generatePrintPDFs:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/print/generate"}
                  method: POST
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                    workflowId: ${runId}
                    generateCMYK: true
                    skipQA: ${qaSkip}
                result: printGenerationResult

            # Preserve generated assets before calling QA, including when its instance terminates.
            - saveGeneratedAssets:
                assign:
                  - activePrintResult: ${printGenerationResult.body}

            - checkShouldRunQA:
                switch:
                  - condition: ${qaSkip == true}
                    next: initializeDeliveryStatus

            - qualityCheckPDF:
                try:
                  steps:
                    - callQualityCheck:
                        call: http.request
                        args:
                          url: ${baseUrl + "/internal/print/quality-check"}
                          method: POST
                          auth: { type: OIDC }
                          body:
                            storyId: ${storyId}
                            runId: ${runId}
                            printResult: ${activePrintResult}
                        result: qaResult
                    - setActivePrintResultFromQa:
                        assign:
                          - qaStatus: ${qaResult.body.qaStatus}
                          - qaReportUrl: ${qaResult.body.reportUrl}
                          - qaCriticalCount: ${qaResult.body.criticalCount}
                          - qaWarningCount: ${qaResult.body.warningCount}
                          - qaFixesApplied: ${qaResult.body.fixesApplied}
                          - qaCriticalErrors: ${qaResult.body.criticalErrors}
                          - activePrintResult: ${qaResult.body.printResult}
                except:
                  as: qaError
                  steps:
                    - recordUnavailableQa:
                        assign:
                          - qaStatus: 'review_failed'
                          - qaReportUrl: null
                          - qaWarningCount: 0
                          - qaCriticalCount: 1
                          - qaFixesApplied: []
                          - qaCriticalErrors:
                              - code: 'print_qa_unavailable'
                                severity: 'critical'
                                message: 'The print QA service did not return a report.'
                                suggestedFix: 'Inspect the QA service logs and rerun QA for the generated PDFs.'
                    - logUnavailableQa:
                        call: sys.log
                        args:
                          severity: ERROR
                          data:
                            event: 'print_qa_unavailable'
                            storyId: ${storyId}
                            runId: ${runId}
                            tags: ${map.get(qaError, "tags")}
                            httpStatus: ${map.get(qaError, "code")}

            - checkShouldAlertAdmins:
                switch:
                  - condition: ${qaCriticalCount > 0}
                    next: notifyPrintQaAdmins
                next: initializeDeliveryStatus

            - notifyPrintQaAdmins:
                try:
                  steps:
                    - callQualityAlert:
                        try:
                          call: http.request
                          args:
                            url: ${baseUrl + "/internal/print/quality-alert"}
                            method: POST
                            timeout: 50
                            auth: { type: OIDC }
                            body:
                              storyId: ${storyId}
                              runId: ${runId}
                              reportUrl: ${qaReportUrl}
                              criticalErrors: ${qaCriticalErrors}
                              fixesApplied: ${qaFixesApplied}
                              printResult: ${activePrintResult}
                          result: qaAlertResult
                        retry:
                          predicate: ${retryPrintQaAlertBeforeDispatch}
                          max_retries: 2
                          backoff:
                            initial_delay: 2
                            max_delay: 5
                            multiplier: 2
                    - recordQaAlertResult:
                        assign:
                          - qaAlertSent: ${default(map.get(qaAlertResult.body, "sent"), false)}
                          - qaAlertFailureReason: ${map.get(qaAlertResult.body, "reason")}
                except:
                  as: alertError
                  steps:
                    - recordQaAlertError:
                        assign:
                          - qaAlertFailureReason: ${default(map.get(alertError, ["body", "reason"]), "alert_service_unavailable")}

            - initializeDeliveryStatus:
                switch:
                  - condition: ${origin == "self-service" and delivery != null}
                    next: markDeliveryPending
                next: markRunCompleted

            - markDeliveryPending:
                assign:
                  - printDeliveryStatus: 'pending'

            # Persist the generated PDFs and QA outcome before customer delivery.
            - markRunCompleted:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/runs/" + runId}
                  method: PATCH
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                    status: 'completed'
                    currentStep: 'completed'
                    endedAt: ${time.format(sys.now())}
                    metadata:
                      interiorPdfUrl: ${activePrintResult.interiorPdfUrl}
                      coverPdfUrl: ${activePrintResult.coverPdfUrl}
                      interiorCmykPdfUrl: ${map.get(activePrintResult, "interiorCmykPdfUrl")}
                      coverCmykPdfUrl: ${map.get(activePrintResult, "coverCmykPdfUrl")}
                      printQaSkipped: ${qaSkip}
                      printQaStatus: ${qaStatus}
                      printQaReportUrl: ${qaReportUrl}
                      printQaCriticalCount: ${qaCriticalCount}
                      printQaWarningCount: ${qaWarningCount}
                      printQaFixesApplied: ${qaFixesApplied}
                      printQaAlertSent: ${qaAlertSent}
                      printQaAlertFailureReason: ${qaAlertFailureReason}
                      printDeliveryStatus: ${printDeliveryStatus}

            - setCompletedStage:
                assign:
                  - currentStage: 'completed'

            # 6. Delivery is best-effort and never changes the completed product state.
            - checkShouldNotify:
                switch:
                  - condition: ${origin == "self-service" and delivery != null}
                    next: notifySelfPrintCustomers
                next: checkQaAlertFailure

            - notifySelfPrintCustomers:
                try:
                  steps:
                    - callCustomerNotification:
                        call: http.request
                        args:
                          url: ${baseUrl + "/internal/print/self-service/notify"}
                          method: POST
                          auth: { type: OIDC }
                          body:
                            storyId: ${storyId}
                            runId: ${runId}
                            delivery: ${delivery}
                            initiatedBy: ${initiatedBy}
                            origin: ${origin}
                            printResult: ${activePrintResult}
                        result: notificationResult
                    - readDeliveryStatus:
                        assign:
                          - printDeliveryStatus: ${default(map.get(notificationResult.body, "deliveryStatus"), "unknown")}
                except:
                  as: deliveryError
                  steps:
                    - recordDeliveryUncertainty:
                        assign:
                          - printDeliveryStatus: 'unknown'
                    - logDeliveryFailure:
                        call: sys.log
                        args:
                          severity: ERROR
                          data:
                            event: 'self_print_delivery_unconfirmed'
                            storyId: ${storyId}
                            runId: ${runId}
                            tags: ${map.get(deliveryError, "tags")}

            - persistDeliveryOutcome:
                try:
                  call: http.request
                  args:
                    url: ${baseUrl + "/internal/runs/" + runId}
                    method: PATCH
                    auth: { type: OIDC }
                    body:
                      storyId: ${storyId}
                      metadata:
                        printDeliveryStatus: ${printDeliveryStatus}
                retry: ${http.default_retry}
                except:
                  as: persistenceError
                  steps:
                    - logDeliveryOutcomePersistenceFailure:
                        call: sys.log
                        args:
                          severity: ERROR
                          data:
                            event: 'self_print_delivery_status_write_failed'
                            storyId: ${storyId}
                            runId: ${runId}
                            printDeliveryStatus: ${printDeliveryStatus}
                            tags: ${map.get(persistenceError, "tags")}

            - checkQaAlertFailure:
                switch:
                  - condition: ${qaCriticalCount == 0 or qaAlertSent}
                    next: returnSuccess

            - logQaAlertDeliveryFailure:
                call: sys.log
                args:
                  severity: ERROR
                  data:
                    event: 'print_qa_alert_delivery_failed'
                    message: 'Print QA alert delivery failed'
                    storyId: ${storyId}
                    runId: ${runId}
                    qaStatus: ${qaStatus}
                    reason: ${qaAlertFailureReason}

            - returnSuccess:
                return:
                  success: true
                  storyId: ${storyId}
                  runId: ${runId}
                  qaStatus: ${qaStatus}
                  printDeliveryStatus: ${printDeliveryStatus}

        except:
          as: e
          steps:
            - protectCompletedRun:
                switch:
                  - condition: ${currentStage == "completed"}
                    next: raiseError

            - markRunFailed:
                call: http.request
                args:
                  url: ${baseUrl + "/internal/runs/" + runId}
                  method: PATCH
                  auth: { type: OIDC }
                  body:
                    storyId: ${storyId}
                    status: 'failed'
                    currentStep: ${currentStage}
                    failureStage: ${currentStage}
                    endedAt: ${time.format(sys.now())}
                    errorMessage: ${e.message}

            # Re-raise the exception
            - raiseError:
                raise: ${e}

# A lost or ambiguous POST response can conceal a completed legacy email send.
retryPrintQaAlertBeforeDispatch:
  params: [error]
  steps:
    - checkReason:
        return: ${map.get(error, "code") == 502 and map.get(error, ["body", "reason"]) == "manager_lookup_failed"}
